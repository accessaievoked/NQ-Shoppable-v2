# Fly config for the Sienna deployment.
# Deploy with:  fly deploy -c fly.sienna.toml -a nq-shoppable-sienna
# (every other client keeps its own config — no collisions.)

app = "nq-shoppable-sienna"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

# No volume needed — data lives in Neon Postgres (set via DATABASE_URL secret);
# videos live in this client's own Cloudflare R2 (set via R2_* secrets).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  # 1GB, not 512MB: ffmpeg (libx264) gets OOM-killed encoding
  # 1080x1920 phone video alongside Node — "Out of memory: Killed
  # process (ffmpeg)" in the logs, leaving videos stuck on Processing.
  #
  # Starting at 1 CPU, same as sumannathwani and queuniverse. Bump to
  # cpus = 4 (about $2/month more) if encoding several videos at once
  # becomes slow — that's what indethnic and lovecovera needed once
  # their catalogues grew. If 4 CPUs then starts OOM-killing ffmpeg
  # again (same signature, just with 2+ concurrent jobs), raise memory
  # to 4gb to match.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
