# Fly config for the lovecovera.com deployment.
# Deploy with:  fly deploy -c fly.lovecovera.toml -a nq-shoppable-lovecovera
# (claura keeps using the default fly.toml — these never collide.)

app = "nq-shoppable-lovecovera"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

# No volume needed — data lives in Neon Postgres (set via DATABASE_URL secret);
# videos live in this client's own Cloudflare R2 (set via R2_* secrets).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  # 1GB, not 512MB: ffmpeg (libx264) gets OOM-killed encoding
  # 1080x1920 phone video alongside Node — "Out of memory: Killed
  # process (ffmpeg)" in the logs, leaving videos stuck on Processing.
  # NOTE: bumped to 4 CPUs (2026-08-26), matching indethnic, so more than one
  # video can encode in parallel. Memory left at 1gb for now — on indethnic
  # this produced "ffmpeg was killed with signal SIGKILL" once several encodes
  # ran at once. That signature is the cue to raise memory to 4gb here too.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 4
