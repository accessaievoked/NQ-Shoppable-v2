# Fly config for the Umay Banaras deployment.
# Deploy with:  fly deploy -c fly.umaybanaras.toml -a nq-shoppable-umaybanaras

app = "nq-shoppable-umaybanaras"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

# No volume needed — data lives in Neon Postgres (set via DATABASE_URL secret);
# videos live in this client's own Cloudflare R2 (set via R2_* secrets).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  # 1GB, not 512MB: ffmpeg (libx264) gets OOM-killed encoding 1080x1920 phone
  # video alongside Node — "Out of memory: Killed process (ffmpeg)" in the logs,
  # leaving videos stuck on "Processing...". This is not optional.
  #
  # 4 CPUs matches indethnic and lovecovera so more than one video can encode in
  # parallel. Costs ~$7.78/mo vs ~$5.70 for shared-cpu-1x@1GB — drop to cpus = 1
  # if this store uploads rarely. If concurrent encodes start getting OOM-killed
  # again (same signature, just with 2+ jobs at once), raise memory to 4gb.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 4
