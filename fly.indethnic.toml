# Fly config for the Indethnic deployment.
# Deploy with:  fly deploy -c fly.indethnic.toml -a nq-shoppable-indethnic
# (claura, lovecovera and sumannathwani keep their own configs — no collisions.)

app = "nq-shoppable-indethnic"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

# No volume needed — data lives in Neon Postgres (set via DATABASE_URL secret);
# videos live in this client's own Cloudflare R2 (set via R2_* secrets).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  # 1GB, not 512MB: ffmpeg (libx264) gets OOM-killed encoding
  # 1080x1920 phone video alongside Node — "Out of memory: Killed
  # process (ffmpeg)" in the logs, leaving videos stuck on Processing.
  # NOTE: bumped to 4 CPUs (2026-08-26) so more than one video can
  # encode in parallel. Memory left at 1GB for now — if multiple
  # videos processing at once starts OOM-killing ffmpeg again
  # (same "Out of memory: Killed process (ffmpeg)" signature, just
  # with 2+ concurrent jobs), bump memory to 4gb to match.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 4
